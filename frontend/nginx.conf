server {
    listen 80;
    server_name _; # Listen on all addresses

    # pdfjs-dist 的 worker 是 ES Module (.mjs)，浏览器 import() 要求 JS MIME 类型。
    # 注意：types 只能在 location 级使用（server/http 级会覆盖默认 MIME 映射，
    # 导致 .html/.js/.css 全部掉回 octet-stream 被浏览器当下载）。
    # worker 是带 hash 的构建产物，可安全长缓存（immutable）。
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vue 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物（JS/CSS/图片）：内容不可变，长缓存，避免每次刷新重复下载。
    # 注意：这里只加缓存头，不设置 types（.mjs 已由上面的正则 location 处理）。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 入口：绝不缓存。否则部署新版后，浏览器可能继续拿旧的 index.html，
    # 导致 SPA 跳转懒加载到旧版 chunk（用户从个人主页进阅读器看到旧样式，必须强刷才正常）。
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA 路由回退: 刷新 /profile、/notification 等路由时，返回 index.html
    # （Vue Router 用 history 模式，直接访问子路用需要回退到入口）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 用户上传文件（头像等）反向代理到后端容器
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
