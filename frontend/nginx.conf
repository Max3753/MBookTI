server {
    listen 80;
    server_name _; # Listen on all addresses

    # Vue 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退: 刷新 /profile、/notification 等路由时，返回 index.html
    # （Vue Router 用 history 模式，直接访问子路用需要回退到入口）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 用户上传文件（头像等）反向代理到后端容器
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
