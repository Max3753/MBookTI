services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mbookti
    # 显式锁定数据库会话时区为 UTC：保证 func.now() 写入统一为 UTC 无时区时间，
    # 与后端 UtcDatetime 序列化约定一致（否则不同环境的 MySQL 时区不一致会导致时间错乱）
    command: --default-time-zone='+00:00'
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/mbookti?charset=utf8
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEBUG: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # 用户上传文件持久化（容器重建不丢失头像）
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
  uploads_data:
